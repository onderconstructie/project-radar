<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Radar — Projectstatus in één oogopslag</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f0fdf4' stroke='%2310b981' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2310b981' stroke-width='1' opacity='0.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%2310b981' stroke-width='1' opacity='0.3'/%3E%3Cpath d='M16 4 L16 16 L24 8' fill='%2310b981' opacity='0.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2310b981'/%3E%3C/svg%3E">
    <style>
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --white: #ffffff;
            
            --red-50: #fef2f2;
            --red-100: #fee2e2;
            --red-500: #ef4444;
            --red-600: #dc2626;
            
            --orange-50: #fff7ed;
            --orange-100: #ffedd5;
            --orange-500: #f97316;
            --orange-600: #ea580c;
            
            --green-50: #f0fdf4;
            --green-100: #dcfce7;
            --green-500: #22c55e;
            --green-600: #16a34a;
            
            --accent: #10b981;
            --accent-light: #d1fae5;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--slate-50);
            color: var(--slate-700);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--slate-200);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--slate-400);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .header-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.02em;
        }

        .header-text p {
            font-size: 0.8125rem;
            color: var(--slate-500);
        }

        /* Main container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* Project name */
        .project-name-section {
            max-width: 400px;
            margin: 0 auto 1.5rem;
            text-align: center;
        }

        .project-name-input {
            width: 100%;
            padding: 0.625rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            color: var(--slate-800);
            background: var(--white);
            border: 2px solid var(--slate-200);
            border-radius: var(--radius-md);
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .project-name-input::placeholder {
            color: var(--slate-400);
            font-weight: 400;
        }

        .project-name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        /* Main layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: 1fr auto;
            gap: 2rem;
            align-items: stretch;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1.5px solid var(--slate-200);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-400);
            margin-bottom: 1.25rem;
        }

        /* Radar */
        .radar-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 400px;
            margin: 0 auto;
        }

        #radarChart {
            width: 100%;
            height: 100%;
        }

        /* Total status */
        .total-status {
            text-align: center;
            padding: 1.25rem;
            border-radius: var(--radius-md);
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .total-status.status-green {
            background: var(--green-50);
            border: 1.5px solid var(--green-500);
        }
        .total-status.status-orange {
            background: var(--orange-50);
            border: 1.5px solid var(--orange-500);
        }
        .total-status.status-red {
            background: var(--red-50);
            border: 1.5px solid var(--red-500);
        }
        .total-status.status-empty {
            background: var(--slate-50);
            border: 1.5px solid var(--slate-200);
        }

        .total-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }
        .status-green .total-label { color: var(--green-600); }
        .status-orange .total-label { color: var(--orange-600); }
        .status-red .total-label { color: var(--red-600); }
        .status-empty .total-label { color: var(--slate-400); }

        .total-value {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .status-green .total-value { color: var(--green-600); }
        .status-orange .total-value { color: var(--orange-600); }
        .status-red .total-value { color: var(--red-600); }
        .status-empty .total-value { color: var(--slate-400); }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--slate-100);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            color: var(--slate-500);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-dot.red { background: var(--red-500); }
        .legend-dot.orange { background: var(--orange-500); }
        .legend-dot.green { background: var(--green-500); }

        /* Download section */
        .download-section {
            margin-top: auto;
            padding-top: 1.25rem;
            border-top: 1px solid var(--slate-100);
        }

        .download-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-400);
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .download-buttons {
            display: flex;
            gap: 0.625rem;
            justify-content: center;
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1rem;
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            transition: all 0.2s;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--white);
        }
        .btn-primary:hover {
            background: #0d9668;
        }

        .btn-secondary {
            background: var(--slate-100);
            color: var(--slate-600);
        }
        .btn-secondary:hover {
            background: var(--slate-200);
        }

        /* Score items */
        .sliders-list {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            flex-grow: 1;
        }

        .slider-item {
            position: relative;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .slider-label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--slate-700);
            cursor: help;
        }

        .slider-value-badge {
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 0.1875rem 0.625rem;
            border-radius: 9999px;
            min-width: 90px;
            text-align: center;
        }
        .slider-value-badge.val-0 {
            background: var(--slate-100);
            color: var(--slate-400);
        }
        .slider-value-badge.val-1 {
            background: var(--red-100);
            color: var(--red-600);
        }
        .slider-value-badge.val-2 {
            background: var(--orange-100);
            color: var(--orange-600);
        }
        .slider-value-badge.val-3 {
            background: var(--green-100);
            color: var(--green-600);
        }

        /* Score options */
        .score-options {
            display: flex;
            gap: 0.5rem;
        }

        .score-option {
            flex: 1;
            position: relative;
        }

        .score-option input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .score-option label {
            display: block;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--slate-500);
            background: var(--slate-50);
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
        }

        .score-option input:hover + label {
            border-color: var(--slate-300);
        }

        .score-option input:checked + label.score-1 {
            background: var(--red-50);
            border-color: var(--red-500);
            color: var(--red-600);
        }
        .score-option input:checked + label.score-2 {
            background: var(--orange-50);
            border-color: var(--orange-500);
            color: var(--orange-600);
        }
        .score-option input:checked + label.score-3 {
            background: var(--green-50);
            border-color: var(--green-500);
            color: var(--green-600);
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            z-index: 100;
            background: var(--slate-800);
            color: var(--white);
            font-size: 0.75rem;
            padding: 0.625rem 0.875rem;
            border-radius: var(--radius-sm);
            max-width: 280px;
            line-height: 1.4;
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.15s, transform 0.15s;
        }

        .tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }

        .instructions {
            font-size: 0.8125rem;
            color: var(--slate-400);
            text-align: center;
            margin-top: 1rem;
        }

        /* Reset card - full width */
        .reset-card {
            grid-column: 1 / -1;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1.5px solid var(--slate-200);
            padding: 1.25rem 1.5rem;
            text-align: center;
        }

        .reset-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-400);
            margin-bottom: 0.75rem;
        }

        .btn-reset {
            width: 100%;
            max-width: 300px;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            background: var(--slate-50);
            color: var(--slate-500);
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            border-color: var(--red-300);
            color: var(--red-500);
            background: var(--red-50);
        }

        .btn-reset svg {
            width: 16px;
            height: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--accent);
            font-size: 0.8125rem;
        }

        @media (max-width: 900px) {
            .back-link {
                position: static;
                margin-bottom: 0.75rem;
            }
            
            .header {
                flex-direction: column;
                padding: 1rem 1.5rem;
            }
        }

        @media (max-width: 640px) {
            .container { padding: 1rem 1.25rem; }
            .legend { flex-wrap: wrap; gap: 0.75rem; }
            .score-option label {
                font-size: 0.6875rem;
                padding: 0.375rem 0.25rem;
            }
            .download-buttons {
                flex-direction: column;
            }
            .download-buttons .btn {
                width: 100%;
            }
            .btn-reset {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://onderconstructie.github.io/projectmanagement/" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Projectmanagement
        </a>
        <div class="header-content">
            <div class="logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
                    <circle cx="20" cy="20" r="10" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
                    <circle cx="20" cy="20" r="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>
                    <path d="M20 6 L20 20 L32 12" fill="#10b981" opacity="0.6"/>
                    <circle cx="20" cy="20" r="2.5" fill="#10b981"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>Project Radar</h1>
                <p>Projectstatus in één oogopslag</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="project-name-section">
            <input type="text" class="project-name-input" id="projectName" placeholder="Projectnaam invullen..." autocomplete="off">
        </div>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">Statusoverzicht</h2>
                <div class="radar-container">
                    <canvas id="radarChart"></canvas>
                </div>
                
                <div class="total-status status-empty" id="totalStatus">
                    <div class="total-label">Totaalstatus</div>
                    <div class="total-value" id="totalValue">—</div>
                </div>

                <div class="legend">
                    <div class="legend-item"><span class="legend-dot red"></span><span>Zwaar probleem</span></div>
                    <div class="legend-item"><span class="legend-dot orange"></span><span>Licht probleem</span></div>
                    <div class="legend-item"><span class="legend-dot green"></span><span>On track</span></div>
                </div>

                <div class="download-section">
                    <div class="download-label">Downloaden</div>
                    <div class="download-buttons">
                        <button class="btn btn-primary" id="downloadPng">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            PNG
                        </button>
                        <button class="btn btn-secondary" id="downloadPdf">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                            PDF
                        </button>
                        <button class="btn btn-secondary" id="downloadCsv">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/></svg>
                            CSV
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">Beoordeling per categorie</h2>
                <div class="sliders-list" id="slidersList"></div>
                <p class="instructions">Klik op een status • Hover voor uitleg</p>
            </div>

            <div class="reset-card">
                <div class="reset-label">Opnieuw beginnen?</div>
                <button class="btn-reset" id="resetBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Reset alles
                </button>
            </div>

        </div>
    </div>

    <footer class="footer">Focus op wat je kunt sturen; laat de rest zijn werk doen.</footer>
    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const categories = [
            { id: 'scope', label: 'Scope', weight: 1.2, explanations: {
                0: 'Scope: Nog niet beoordeeld',
                1: 'Scope: Grote wijzigingen of onduidelijkheid over deliverables. Dreigt uit de hand te lopen.',
                2: 'Scope: Kleine wijzigingen of aandachtspunten. Beheersbaar maar moet gemonitord worden.',
                3: 'Scope: Helder gedefinieerd en stabiel. Deliverables liggen op schema.'
            }},
            { id: 'planning', label: 'Planning', weight: 1.2, explanations: {
                0: 'Planning: Nog niet beoordeeld',
                1: 'Planning: Significante vertraging (>2 weken). Kritieke mijlpalen in gevaar.',
                2: 'Planning: Lichte vertraging of druk op deadlines. Extra aandacht nodig.',
                3: 'Planning: Op schema. Mijlpalen worden gehaald volgens plan.'
            }},
            { id: 'budget', label: 'Budget', weight: 1.1, explanations: {
                0: 'Budget: Nog niet beoordeeld',
                1: 'Budget: Significante overschrijding (>10%) of onvoldoende middelen. Escalatie nodig.',
                2: 'Budget: Lichte druk of afwijking. Bijsturing mogelijk maar moet bewaakt worden.',
                3: 'Budget: Binnen budget. Kosten onder controle en voorspelbaar.'
            }},
            { id: 'communication', label: 'Communicatie', weight: 1.0, explanations: {
                0: 'Communicatie: Nog niet beoordeeld',
                1: 'Communicatie: Ernstige miscommunicatie of informatietekort. Stakeholders niet op de hoogte.',
                2: 'Communicatie: Enkele hiaten in informatiedeling. Verbetering nodig in frequentie of helderheid.',
                3: 'Communicatie: Helder en tijdig. Alle betrokkenen zijn goed geïnformeerd.'
            }},
            { id: 'risks', label: "Risico's", weight: 1.3, explanations: {
                0: "Risico's: Nog niet beoordeeld",
                1: "Risico's: Hoge risico's met grote kans en impact. Onvoldoende mitigatie.",
                2: "Risico's: Bekende risico's met mitigatie in uitvoering. Verhoogde alertheid nodig.",
                3: "Risico's: Geïdentificeerd en beheerst. Geen directe bedreigingen."
            }},
            { id: 'issues', label: 'Issues', weight: 1.2, explanations: {
                0: 'Issues: Nog niet beoordeeld',
                1: 'Issues: Kritieke blokkades die voortgang belemmeren. Escalatie vereist.',
                2: 'Issues: Open issues die aandacht vragen. Impact beperkt maar moet opgelost.',
                3: 'Issues: Geen openstaande blokkades. Issues worden tijdig opgelost.'
            }},
            { id: 'resources', label: 'Resources', weight: 1.0, explanations: {
                0: 'Resources: Nog niet beoordeeld',
                1: 'Resources: Ernstig capaciteitstekort of uitval van sleutelpersonen.',
                2: 'Resources: Krapte in bezetting of skills. Tijdelijke oplossingen nodig.',
                3: 'Resources: Team compleet en capabel. Voldoende capaciteit beschikbaar.'
            }},
            { id: 'dependencies', label: 'Afhankelijkheden', weight: 1.1, explanations: {
                0: 'Afhankelijkheden: Nog niet beoordeeld',
                1: 'Afhankelijkheden: Kritieke externe afhankelijkheid in gevaar. Dreigt te blokkeren.',
                2: 'Afhankelijkheden: Externe leveringen onder druk. Actieve opvolging nodig.',
                3: 'Afhankelijkheden: Alle externe leveringen op schema. Geen zorgen.'
            }},
            { id: 'stakeholders', label: 'Stakeholders', weight: 1.0, explanations: {
                0: 'Stakeholders: Nog niet beoordeeld',
                1: 'Stakeholders: Conflicten of weerstand. Steun voor project onder druk.',
                2: 'Stakeholders: Enkele zorgen of verwachtingsmanagement nodig.',
                3: 'Stakeholders: Tevreden en betrokken. Goede communicatie en steun.'
            }}
        ];

        const scores = {};
        categories.forEach(c => scores[c.id] = 0);

        let radarChart;

        function getValueLabel(v) {
            if (v === 0) return '—';
            if (v === 1) return 'Zwaar probleem';
            if (v === 2) return 'Licht probleem';
            return 'On track';
        }

        function calculateWeightedAverage() {
            let totalWeight = 0;
            let weightedSum = 0;
            categories.forEach(c => {
                if (scores[c.id] > 0) {
                    weightedSum += scores[c.id] * c.weight;
                    totalWeight += c.weight;
                }
            });
            return totalWeight > 0 ? weightedSum / totalWeight : 0;
        }

        function getTotalStatusLabel(avg) {
            if (avg === 0) return '—';
            if (avg < 1.5) return 'Kritiek';
            if (avg < 2.0) return 'Zwaar probleem';
            if (avg < 2.5) return 'Aandacht nodig';
            if (avg < 2.8) return 'Licht probleem';
            return 'On track';
        }

        function getStatusClass(avg) {
            if (avg === 0) return 'empty';
            if (avg < 2.0) return 'red';
            if (avg < 2.7) return 'orange';
            return 'green';
        }

        function getChartColors(avg) {
            if (avg === 0) return { bg: 'rgba(148, 163, 184, 0.15)', border: '#94a3b8' };
            if (avg < 2.0) return { bg: 'rgba(239, 68, 68, 0.15)', border: '#ef4444' };
            if (avg < 2.7) return { bg: 'rgba(249, 115, 22, 0.15)', border: '#f97316' };
            return { bg: 'rgba(34, 197, 94, 0.15)', border: '#22c55e' };
        }

        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories.map(c => c.label),
                    datasets: [{
                        data: categories.map(() => 0),
                        backgroundColor: 'rgba(148, 163, 184, 0.15)',
                        borderColor: '#94a3b8',
                        borderWidth: 2,
                        pointBackgroundColor: '#94a3b8',
                        pointBorderColor: '#fff',
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => ctx.raw === 0 ? 'Niet ingevuld' : getValueLabel(ctx.raw)
                            }
                        }
                    },
                    scales: {
                        r: {
                            min: 0,
                            max: 3,
                            ticks: { display: false },
                            grid: { color: '#e2e8f0' },
                            angleLines: { color: '#e2e8f0' },
                            pointLabels: { font: { size: 11, weight: '500' }, color: '#334155' }
                        }
                    }
                }
            });
        }

        function updateChart() {
            const data = categories.map(c => scores[c.id]);
            const weightedAvg = calculateWeightedAverage();
            const colors = getChartColors(weightedAvg);

            radarChart.data.datasets[0].data = data;
            radarChart.data.datasets[0].backgroundColor = colors.bg;
            radarChart.data.datasets[0].borderColor = colors.border;
            radarChart.data.datasets[0].pointBackgroundColor = data.map(d => {
                if (d === 0) return '#94a3b8';
                if (d === 1) return '#ef4444';
                if (d === 2) return '#f97316';
                return '#22c55e';
            });
            radarChart.update();

            const el = document.getElementById('totalStatus');
            el.className = `total-status status-${getStatusClass(weightedAvg)}`;
            document.getElementById('totalValue').textContent = getTotalStatusLabel(weightedAvg);
        }

        function createScoreInputs() {
            const container = document.getElementById('slidersList');
            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'slider-item';
                item.innerHTML = `
                    <div class="slider-header">
                        <span class="slider-label" data-cat="${cat.id}">${cat.label}</span>
                        <span class="slider-value-badge val-0" id="badge-${cat.id}">—</span>
                    </div>
                    <div class="score-options">
                        <div class="score-option">
                            <input type="radio" name="score-${cat.id}" id="score-${cat.id}-1" value="1">
                            <label for="score-${cat.id}-1" class="score-1">Zwaar</label>
                        </div>
                        <div class="score-option">
                            <input type="radio" name="score-${cat.id}" id="score-${cat.id}-2" value="2">
                            <label for="score-${cat.id}-2" class="score-2">Licht</label>
                        </div>
                        <div class="score-option">
                            <input type="radio" name="score-${cat.id}" id="score-${cat.id}-3" value="3">
                            <label for="score-${cat.id}-3" class="score-3">On track</label>
                        </div>
                    </div>
                `;
                container.appendChild(item);

                [1,2,3].forEach(v => {
                    document.getElementById(`score-${cat.id}-${v}`).addEventListener('change', e => {
                        scores[cat.id] = parseInt(e.target.value);
                        updateBadge(cat.id, scores[cat.id]);
                        updateChart();
                    });
                });

                const label = item.querySelector('.slider-label');
                const badge = item.querySelector('.slider-value-badge');
                const scoreLabels = item.querySelectorAll('.score-option label');
                
                label.addEventListener('mouseenter', e => showTooltip(e, cat));
                label.addEventListener('mouseleave', hideTooltip);
                
                badge.addEventListener('mouseenter', e => showTooltip(e, cat));
                badge.addEventListener('mouseleave', hideTooltip);
                
                scoreLabels.forEach((scoreLabel, idx) => {
                    scoreLabel.addEventListener('mouseenter', e => showScoreTooltip(e, cat, idx + 1));
                    scoreLabel.addEventListener('mouseleave', hideTooltip);
                });
            });
        }

        function updateBadge(id, v) {
            const b = document.getElementById(`badge-${id}`);
            b.className = `slider-value-badge val-${v}`;
            b.textContent = getValueLabel(v);
        }

        function showTooltip(e, cat) {
            const t = document.getElementById('tooltip');
            t.textContent = cat.explanations[scores[cat.id]];
            const r = e.target.getBoundingClientRect();
            t.style.left = r.left + 'px';
            t.style.top = (r.bottom + 8) + 'px';
            t.classList.add('show');
        }

        function showScoreTooltip(e, cat, scoreValue) {
            const t = document.getElementById('tooltip');
            t.textContent = cat.explanations[scoreValue];
            const r = e.target.getBoundingClientRect();
            t.style.left = Math.max(10, r.left - 50) + 'px';
            t.style.top = (r.bottom + 8) + 'px';
            t.classList.add('show');
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('show');
        }

        function reset() {
            categories.forEach(cat => {
                scores[cat.id] = 0;
                [1,2,3].forEach(v => document.getElementById(`score-${cat.id}-${v}`).checked = false);
                updateBadge(cat.id, 0);
            });
            document.getElementById('projectName').value = '';
            updateChart();
        }

        function downloadPng() {
            const canvas = document.getElementById('radarChart');
            const name = document.getElementById('projectName').value || 'Project Radar';
            const weightedAvg = calculateWeightedAverage();
            const exp = document.createElement('canvas');
            const ctx = exp.getContext('2d');
            const pad = 60;
            exp.width = canvas.width + pad * 2;
            exp.height = canvas.height + pad * 2 + 40;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, exp.width, exp.height);
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 24px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, exp.width / 2, 40);
            ctx.fillStyle = '#64748b';
            ctx.font = '14px -apple-system, sans-serif';
            ctx.fillText(`${new Date().toLocaleDateString('nl-NL')} — ${getTotalStatusLabel(weightedAvg)}`, exp.width / 2, 60);
            ctx.drawImage(canvas, pad, pad + 40);
            const link = document.createElement('a');
            link.download = `${name.toLowerCase().replace(/\s+/g, '-')}-radar.png`;
            link.href = exp.toDataURL('image/png');
            link.click();
        }

        function downloadPdf() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const name = document.getElementById('projectName').value || 'Project Radar';
            const canvas = document.getElementById('radarChart');
            const weightedAvg = calculateWeightedAverage();
            
            pdf.setFontSize(22);
            pdf.setTextColor(30, 41, 59);
            pdf.text(name, 105, 25, { align: 'center' });
            pdf.setFontSize(11);
            pdf.setTextColor(100, 116, 139);
            pdf.text(`Status per ${new Date().toLocaleDateString('nl-NL')}`, 105, 33, { align: 'center' });
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 35, 45, 140, 140);
            
            pdf.setFontSize(13);
            pdf.setTextColor(30, 41, 59);
            pdf.text('Beoordeling per categorie', 20, 200);
            let y = 210;
            pdf.setFontSize(10);
            categories.forEach(cat => {
                const s = scores[cat.id];
                const col = s === 0 ? [148,163,184] : s === 1 ? [239,68,68] : s === 2 ? [249,115,22] : [34,197,94];
                pdf.setTextColor(51, 65, 85);
                pdf.text(cat.label, 20, y);
                pdf.setTextColor(...col);
                pdf.text(getValueLabel(s), 80, y);
                y += 7;
            });
            
            pdf.setFontSize(12);
            pdf.setTextColor(30, 41, 59);
            pdf.text(`Totaalstatus: ${getTotalStatusLabel(weightedAvg)}`, 20, y + 10);
            pdf.save(`${name.toLowerCase().replace(/\s+/g, '-')}-radar.pdf`);
        }

        function downloadCsv() {
            const name = document.getElementById('projectName').value || 'Project Radar';
            const weightedAvg = calculateWeightedAverage();
            const date = new Date().toLocaleDateString('nl-NL');
            
            let csv = 'Project,Datum,Categorie,Status\n';
            categories.forEach(cat => {
                const status = getValueLabel(scores[cat.id]);
                csv += `"${name}","${date}","${cat.label}","${status}"\n`;
            });
            csv += `"${name}","${date}","TOTAAL","${getTotalStatusLabel(weightedAvg)}"\n`;
            
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${name.toLowerCase().replace(/\s+/g, '-')}-radar.csv`;
            link.click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            createScoreInputs();
            initChart();
            document.getElementById('resetBtn').addEventListener('click', reset);
            document.getElementById('downloadPng').addEventListener('click', downloadPng);
            document.getElementById('downloadPdf').addEventListener('click', downloadPdf);
            document.getElementById('downloadCsv').addEventListener('click', downloadCsv);
        });
    </script>
</body>
</html>
